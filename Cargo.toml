[package]
name = "amail-bridge"
version = "0.1.0"
edition = "2021"
description = "Transparent bridge between amail relay and Hermes gateway"

[dependencies]
axum = "0.7"
axum-server = "0.7"
reqwest = { version = "0.12", features = ["json"] }
hyper = "1"

rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2", optional = true }

toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

tokio = { version = "1", features = ["full"] }

notify = "6"
dirs = "5"
urlencoding = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"

hex = "0.4"
hmac = "0.12"
sha2 = "0.10"

[features]
default = []
tls = ["axum-server/tls-rustls", "rustls", "rustls-pemfile"]
