# amail-bridge configuration

mode = "pull"  # "push" or "pull" (default: "pull")

# Per-agent host overrides for multi-machine deployments.
# Regex → IP/hostname. First match wins. Unmatched agents default to 127.0.0.1.
[hosts]
".*@admin.relay"    = "192.168.1.2"
"bob@.*"            = "192.168.1.11"
"alice@admin.relay" = "192.168.1.10"

# ── Pull mode (bridge polls relay outbound) ───────────────────────
[pull]
relay_url = "http://192.168.1.1:38080"  # Relay HTTP API URL
admin_key = "sk-..."                    # System admin API key from relay
system_id = "admin"                     # System ID for pending-query (default: "admin")
poll_interval_sec = 10                  # Poll interval in seconds (default: 10)

# ── Push mode (bridge receives external POSTs) ────────────────────
# Uncomment to enable. addr format: "host:port". hostname enables TLS.
#
# [push]
# addr = "0.0.0.0:38080"                    # default: "0.0.0.0:38080"
# hostname = "bridge.example.com"           # enables TLS (ACME auto-cert if no tls_cert/tls_key)
# tls_cert = "/etc/ssl/bridge.crt"          # static TLS cert path
# tls_key  = "/etc/ssl/bridge.key"          # static TLS key path
# acme_cache = "/var/cache/acme"            # ACME cache dir (default: ~/.hermes/acme)
# blacklist_ips = ["1.2.3.4", "10.0.0.0/8"] # permanently blocked IPs/CIDRs (default: [])
# allowed_ips = ["10.0.0.0/8", "192.168.1.1"] # IP allowlist, empty = allow all (default: [])
# rate_limit = 30                            # req/sec per source IP, 0 = disabled (default: 30)
# body_limit_mb = 20                         # max request body size in MB (default: 20)

# Virtual host sites (optional, push mode only)
# [[push.sites]]
# domain = "www.example.com"
# root = "/var/www/example"                  # static site directory
#
# [[push.sites]]
# domain = "api.example.com"
# proxy = "127.0.0.1:3000"                   # reverse proxy target
#
# [[push.sites]]
# domain = "old.example.com"
# redirect = "https://www.example.com"       # 308 redirect URL
