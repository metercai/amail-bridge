# ── amail-bridge configuration ─────────────────────────────────────
# Docs: https://github.com/nousresearch/amail-bridge

mode = "pull"  # "push" or "pull"

# ── Per-agent host overrides (multi-machine LAN deployments) ──────
# Regex pattern → IP or hostname. First match wins.
# Agents not matching any pattern default to 127.0.0.1 (same-machine).
#
[hosts]
".*@admin.relay"    = "192.168.1.2"    # all agents on this domain → this host
"bob@.*"            = "192.168.1.11"   # bob on any domain → this host
"alice@admin.relay" = "192.168.1.10"   # exact match (precise overrides first)

# ── Push mode (bridge receives external POSTs) ────────────────────
[push]
bind_host = "0.0.0.0"
bind_port = 38080
tls = false
# public_url = "https://bridge.example.com"   # Printed at startup for relay config
# tls_cert = "/etc/ssl/bridge.crt"            # Required when tls = true
# tls_key  = "/etc/ssl/bridge.key"

# ── Virtual host sites (optional, push mode only) ─────────────────
# Each site maps a domain to static files, a reverse proxy, or a redirect.
# [[push.sites]]
# domain = "www.example.com"
# root = "/var/www/example"                  # static site
#
# [[push.sites]]
# domain = "api.example.com"
# proxy = "127.0.0.1:3000"                   # reverse proxy
#
# [[push.sites]]
# domain = "old.example.com"
# redirect = "https://www.example.com"       # 308 redirect

# ── Pull mode (bridge polls relay outbound) ───────────────────────
[pull]
relay_url = "http://192.168.1.1:38080"
admin_key = "sk-..."   # system_admin API key from relay
system_id = "admin"
poll_interval_sec = 10
