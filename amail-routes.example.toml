# amail-bridge multi-machine routing
#
# Copy this file to amail-routes.toml and edit to match your setup.
# Changes take effect immediately (inotify hot-reload).

# Local agents are auto-discovered from ~/.hermes/profiles/*/.
# Entries here override auto-discovery — manual intervention takes precedence.
#
# Two types of entries:
#   "exact@email"      = "host:port"   # exact email override
#   "regex-pattern"    = "host:port"   # expanded to all matching emails

"alice@admin.relay"  = "127.0.0.1:8645"
".*@admin\\.relay"   = "192.168.1.2:8645"
