name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-amd64
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux-arm64
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: macos-amd64
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-arm64
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-amd64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          BIN="amail-bridge-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.ext }}"
          cp target/${{ matrix.target }}/release/amail-bridge${{ matrix.ext }} "$BIN"
          echo "BIN=$BIN" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amail-bridge-${{ github.ref_name }}-${{ matrix.platform }}
          path: amail-bridge-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: amail-bridge-${{ github.ref_name }}-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
