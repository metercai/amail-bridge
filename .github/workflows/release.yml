name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: amail-bridge-linux-amd64
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: amail-bridge-linux-arm64
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: amail-bridge-macos-amd64
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: amail-bridge-macos-arm64
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: amail-bridge-windows-amd64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/amail-bridge${{ matrix.ext }} \
             ${{ matrix.artifact }}-${{ github.ref_name }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: ${{ matrix.artifact }}-${{ github.ref_name }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: amail-bridge-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
