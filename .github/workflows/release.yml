name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux musl (zero deps, any kernel ≥ 2.6) ──
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-amd64
            ext: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux-arm64
            ext: ""
          # ── Linux glibc (minor runtime dep, wider ecosystem compat) ──
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            platform: linux-amd64-gnu
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux-arm64-gnu
            ext: ""
          # ── macOS (target macOS 11+) ──
          - target: x86_64-apple-darwin
            os: macos-13
            platform: macos-amd64
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-14
            platform: macos-arm64
            ext: ""
          # ── Windows ──
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-amd64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install deps (musl)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ contains(matrix.os, 'macos') && '11.0' || '' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          BIN="amail-bridge-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.ext }}"
          cp target/${{ matrix.target }}/release/amail-bridge${{ matrix.ext }} "$BIN"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amail-bridge-${{ github.ref_name }}-${{ matrix.platform }}
          path: amail-bridge-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: amail-bridge-${{ github.ref_name }}-*/*
          body: |
            ## Platform variants

            | Suffix | libc | Runtime deps | Compatible with |
            |--------|------|-------------|-----------------|
            | `linux-amd64` | musl | **none** | Any Linux kernel ≥ 2.6 |
            | `linux-amd64-gnu` | glibc ≥ 2.35 | none | Ubuntu 22.04+, Debian 12+, RHEL 9+ |
            | `linux-arm64` | musl | **none** | Any Linux kernel ≥ 2.6 |
            | `linux-arm64-gnu` | glibc ≥ 2.39 | none | Ubuntu 24.04+, Debian 13+ |
            | `macos-amd64` | — | none | macOS 11+ (Intel) |
            | `macos-arm64` | — | none | macOS 11+ (Apple Silicon) |
            | `windows-amd64` | — | none | Windows 10+ |

            All TLS crypto is pure Rust (ring/rustls) — no OpenSSL required on any platform.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
