name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: amail-bridge-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: amail-bridge-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: amail-bridge-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: amail-bridge-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: amail-bridge-windows-amd64.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact: amail-bridge-windows-arm64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install aarch64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          SRC="target/${{ matrix.target }}/release/amail-bridge"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            SRC="${SRC}.exe"
          fi
          cp "$SRC" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4

      - name: Flatten artifact dirs
        run: |
          for d in amail-bridge-*/; do
            cp "$d"* .
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: amail-bridge-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
