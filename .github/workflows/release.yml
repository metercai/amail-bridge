name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: amail-bridge-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: amail-bridge-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: amail-bridge-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: amail-bridge-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: amail-bridge-windows-amd64.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact: amail-bridge-windows-arm64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (linux-arm64 via cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build linux-arm64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          SRC="target/${{ matrix.target }}/release/amail-bridge"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            SRC="${SRC}.exe"
          fi
          cp "$SRC" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4

      - name: Flatten artifact dirs
        run: |
          for d in amail-bridge-*/; do
            cp "$d"* .
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: amail-bridge-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
